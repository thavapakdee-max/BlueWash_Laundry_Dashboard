<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ | ซักทีซะบ้อ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f7fc;color:#17345d;font-family:Kanit,sans-serif}
    .card{width:min(100%,420px);padding:36px;background:#fff;border:1px solid #e2ebf6;border-radius:20px;box-shadow:0 18px 50px #17345d12}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#eaf3ff;color:#347fe5;font-size:25px}.brand b{display:block;font-size:22px}.brand small{color:#8194ae;font-size:12px;letter-spacing:.08em}
    h1{margin:0 0 6px;font-size:23px}p{margin:0 0 22px;color:#8194ae}.field{display:block;margin:16px 0}.field span{display:block;margin-bottom:6px;font-size:14px}.field input{width:100%;height:46px;padding:0 13px;border:1px solid #d9e4f1;border-radius:10px;font:inherit;outline:none}.field input:focus{border-color:#4285ed;box-shadow:0 0 0 3px #4285ed20}
    button{width:100%;height:48px;border:0;border-radius:10px;background:#347fe5;color:#fff;font:500 16px Kanit,sans-serif;cursor:pointer}button:hover{background:#276bd0}.error{margin:14px 0;padding:10px 12px;border-radius:9px;background:#fff1f0;color:#b42318;font-size:14px}.setup{margin-top:14px;padding:12px;border-radius:9px;background:#fff8e7;color:#886313;font-size:13px}
  </style>
</head>
<body><main class="card">
  <div class="brand"><div class="icon">◉</div><div><b>ซักทีซะบ้อ</b><small>ADMIN ACCESS</small></div></div>
  <h1>เข้าสู่ระบบผู้ดูแล</h1><p>กรุณาใส่ชื่อผู้ใช้และรหัสผ่านเพื่อจัดการร้าน</p>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('admin_login', next=request.args.get('next','')) }}">
    <label class="field"><span>ชื่อผู้ใช้</span><input name="username" autocomplete="username" required autofocus></label>
    <label class="field"><span>รหัสผ่าน</span><input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">เข้าสู่ระบบ</button>
  </form>
  {% if not configured %}<div class="setup">ยังไม่ได้ตั้งค่า ADMIN_USERNAME และ ADMIN_PASSWORD กรุณาตั้งค่าตามไฟล์ .env.example ก่อนเข้าสู่ระบบ</div>{% endif %}
</main></body></html>
